<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no user-scalable=no"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/js/all.min.js"
      integrity="sha256-KzZiKy0DWYsnwMF+X1DvQngQ2/FxF7MF3Ff72XcpuPs="
      crossorigin="anonymous"
    ></script>
    <title>COPD</title>
    <style>
      * {
        margin: 0;
      }

      .top-bg-image {
        background: url("image/page3/bck.png") no-repeat;
        background-size: 100% 100%;
        width: 100%;
        height: 100vh;
        padding: 0;
        margin: 0;
        background-attachment: fixed;
        background-position: 0 0;
      }

      .text-img {
        position: fixed;
        top: 20%; /* अब top से 20px का gap रहेगा */
        left: 50%;
        transform: translateX(-50%);
        width: 80vw;
        max-width: 500px;
        height: auto;
        object-fit: contain;
        text-align: center;
      }

.heading-img {
    position: fixed;
    top: 28%;           /* Stick to top */
    left: 50%;        /* Center horizontally */
    transform: translateX(-50%); /* Perfect center */
    width: 100%;      /* Full width by default */
    max-width: 500px; /* Optional: cap max width */
    height: auto;     /* Maintain aspect ratio */
    text-align: center;
    z-index: 999;     /* Stay on top of other elements */
}

.bg-circle {
    position: fixed;
    top: 53%;                 
    left: 50%;
    transform: translateX(-50%);  /* Keep perfectly centered */
    width: clamp(80px, 90%, 600px); /* Min 80px, ideal 90% of viewport, max 600px */
    height: auto;                
    text-align: center;
}

.logo {
    position: fixed;
    bottom: 10%;           /* Distance from bottom, relative to viewport */
    right: 10%;            /* Distance from right, relative to viewport */
    width: 200px;  /* Fluid width: min 50px, ideal 10vw, max 150px */
    height: auto;         /* Maintain aspect ratio */
    z-index: 999;         /* Stay above other elements */
    animation: none;      /* Remove animation */
}
@media screen and (max-width: 480px){
    .logo {
    position: fixed;
    bottom: 10%;           /* Distance from bottom, relative to viewport */
    right: 10%;            /* Distance from right, relative to viewport */
    width: 100px;  /* Fluid width: min 50px, ideal 10vw, max 150px */
    height: auto;         /* Maintain aspect ratio */
    z-index: 999;         /* Stay above other elements */
    animation: none;      /* Remove animation */
    }

    .heading-img {
    position: fixed;
    top: 28%;           /* Stick to top */
    left: 50%;        /* Center horizontally */
    transform: translateX(-50%); /* Perfect center */
    width: 100%;      /* Full width by default */
    max-width: 300px; /* Optional: cap max width */
    height: auto;     /* Maintain aspect ratio */
    text-align: center;
    z-index: 999;     /* Stay on top of other elements */
  }
}

    </style>
  </head>

  <body>
    <div class="top-bg-image"></div>
    <img src="image/page3/01.png" alt="" class="text-img" />
     <img src="image/page3/02.png" alt="" class="heading-img" /> 
    <img src="image/page3/03.png" alt="" class="bg-circle" />
    <a href="page4.html"><img src="image/page3/04.png" alt="" class="logo"></a>
  </body>
</html>
