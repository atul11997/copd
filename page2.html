<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no user-scalable=no"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/js/all.min.js"

    <title>COPD</title>
    <style>
      * {
        margin: 0;
      }

      .top-bg-image {
        background: url("image/page2/page_bck.png") no-repeat;
        background-size: 100% 100%;
        width: 100%;
        height: 100vh;
        padding: 0;
        margin: 0;
        background-attachment: fixed;
        background-position: 0 0;
      }

.text-img {
    position: fixed;
    top: 20%;                 /* Vertical placement relative to viewport */
    right: 5%;                 /* Distance from right edge */
    width: clamp(100px, 40vw, 350px);  /* Fluid width: min 100px, ideal 40vw, max 350px */
    height: auto;
    object-fit: contain;
    z-index: 999;
}

.heading-img {
    position: fixed;
    top: 40%;                 
    right: 5%;                 
    width: clamp(80px, 20vw, 200px);   /* Fluid width: min 80px, ideal 20vw, max 200px */
    height: auto;
    text-align: center;
    z-index: 999;
}
    </style>
  </head>

  <body>
    <div class="top-bg-image"></div>
    <img src="image/page2/01.png" alt="" class="text-img" />
