
<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/js/all.min.js" integrity="sha256-KzZiKy0DWYsnwMF+X1DvQngQ2/FxF7MF3Ff72XcpuPs=" crossorigin="anonymous"></script>
    <title>Psoriasis</title>
    <style>
        * {
            margin: 0;
        }

        .top-bg-image {
            background: url('image/01.png') no-repeat;
            background-size: 100% 100%;
            width: 100%;
            height: 100vh;
            padding: 0;
            margin: 0;
            background-attachment: fixed;
            background-position: 0 0;
        }

        /* .text-img {
            position: fixed;
            top: 18vh;
            left: 5vw;
            width: 80vw;
            text-align: center;
        } */

    .text-img {
    position: fixed;
    top: 0vh;
    left: 0vw; 
    width: 0vw; 
    text-align: center;
    animation: slide-in 1s ease-in-out 1s forwards; 
   }
       .heading-img {
    position: fixed;
    top: 0vh;
    left: 0vw; 
    width: 0vw; 
    text-align: center;
    animation: slide-in-heading 1s ease-in-out 1s forwards; 
   }

@keyframes slide-in {
    0% {
        top: 0vh;
        left: 5vw; 
        width: 0vw;
    }
    100% {
        top: 10vh;
        left: 10vw;
        width: 80vw;
    }
}

@keyframes slide-in-heading {
    0% {
        top: 0vh;
        left: 5vw; 
        width: 0vw;
    }
    100% {
        top: 20vh;
        left: 10vw;
        width: 80vw;
    }
}

        .bg-circle {
            position: fixed;
            top: 28vh;
            left: 13vw;
            width: 80vw;
        }

        .para {
            position: fixed;
            bottom: 0vh;
            left: 0vw;
            width: 0vw;
            animation: slide-in-text1 1s ease-in-out 1s forwards; 
        }


        @keyframes slide-in-text1 {
    0% {
        bottom: 0vh;
        left: 0; 
        width: 0;
    }
    100% {
        top: 68vh;
        left: 10vw;
        width: 80vw;
    }
}

        .logo {
            position: fixed;
            bottom: 0vh;
            right: 0vw;
            width: 0vw;
            animation: slide-in-text2 1s ease-in-out 1s forwards; 
        }

        @keyframes slide-in-text2 {
    0% {
        bottom: 0vh;
        left: 0; 
        width: 0;
    }
    100% {
        bottom: 5vh;
        right: 10vw;
        width: 40vw;
    }
}
    </style>
</head>

<body>
    <div class="top-bg-image"></div>
    <img src="image/02.png" alt="" class="text-img">
    <img src="image/03.png" alt="" class="heading-img">
    <img src="image/04.png" alt="" class="bg-circle">
    <img src="image/05.png" alt="" class="para">
    <a href="page2.html"><img src="image/06.png" alt="" class="logo"></a>

</body>

</html>
